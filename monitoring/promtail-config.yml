server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: kafka-python-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: kafka-app
          __path__: /var/log/kafka-app/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            app: app
            msg: msg
      - labels:
          level:
          app:
